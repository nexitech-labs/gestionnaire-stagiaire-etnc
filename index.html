<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCPG — Suivi des stages</title>
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Segoe UI"', 'system-ui', '-apple-system', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <!-- Styles : généraux, relevé individuel, feuilles imprimées -->
  <link rel="stylesheet" href="src/noyau/base.css">
  <link rel="stylesheet" href="src/releve/releve.css">
  <link rel="stylesheet" href="src/impression/impression.css">
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-950 antialiased">
<div id="app">

  <!-- Barre supérieure : retour à l'accueil, fil d'Ariane, section active, état -->
  <header class="sticky top-0 z-30 border-b border-zinc-200 bg-white/95 backdrop-blur">
    <div class="flex h-14 items-center gap-3 px-4 md:px-8">
      <a href="#/accueil" class="flex shrink-0 items-center gap-2.5 rounded-md" title="Accueil">
        <span class="flex h-8 w-8 items-center justify-center rounded-md bg-zinc-900 text-white">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </span>
        <span class="text-sm font-semibold tracking-tight">CCPG</span>
      </a>
      <nav id="crumb" hidden aria-label="Fil d'Ariane" class="flex min-w-0 items-center gap-2 text-sm">
        <span class="text-zinc-300">/</span>
        <span id="crumb-title" class="truncate font-medium text-zinc-700"></span>
      </nav>

      <div class="ml-auto flex min-w-0 items-center gap-2 sm:gap-3">
        <a id="btn-home" href="#/accueil" hidden
          class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-md border border-zinc-200 bg-white px-2.5 text-sm font-medium text-zinc-700 shadow-sm hover:bg-zinc-100">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="hidden sm:inline">Accueil</span>
        </a>
        <div id="section-bar" hidden class="flex min-w-0 items-center gap-2">
          <label for="active-section" class="hidden text-xs font-medium uppercase tracking-wide text-zinc-400 lg:block">Section</label>
          <select id="active-section"
            class="h-8 w-40 min-w-0 rounded-md border border-zinc-200 bg-white px-2 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-zinc-900/20 sm:w-64"></select>
        </div>
        <span id="save-status" role="status" class="inline-flex shrink-0 items-center gap-1.5 text-xs text-zinc-500">
          <span class="save-dot h-2 w-2 shrink-0 rounded-full bg-zinc-300"></span>
          <span id="save-text" class="hidden xl:inline">Données non chargées</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Bandeau discret : demande d'autorisation au premier geste -->
  <div id="perm-banner" hidden class="sticky top-14 z-20 border-b border-amber-200 bg-amber-50 text-amber-900">
    <div class="flex items-center gap-2 px-4 py-2 text-sm md:px-8">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15l6 6"/><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      <span id="perm-banner-text">Cliquez n'importe où pour charger les données</span>
    </div>
  </div>

  <!-- Alertes persistantes -->
  <div id="alerts" class="space-y-2 px-4 pt-4 empty:hidden md:px-8"></div>

  <main class="px-4 py-6 md:px-8">

    <!-- État d'attente -->
    <section id="waiting" class="rounded-lg border border-dashed border-zinc-300 bg-white p-10 text-center">
      <p class="text-sm font-medium text-zinc-700">En attente de l'accès au dossier du projet</p>
      <p class="mt-1 text-sm text-zinc-500">Les données seront affichées dès que la base <code class="rounded bg-zinc-100 px-1 py-0.5 text-xs">db/ccpg.db</code> sera chargée.</p>
    </section>

    <div id="workspace" hidden>
      <!-- Page d'accueil (cartes vers les pages) : src/accueil/accueil.vue.js -->
      <div data-vue="accueil"></div>

      <!-- Page Barèmes & coefficients (onglets, import / export) : src/baremes/baremes.vue.js -->
      <div data-vue="baremes"></div>

      <!-- Pages liées à la section active (en-tête commun + une page par onglet) -->
      <div id="section-scope" hidden class="space-y-6">
        <!-- En-tête des pages d'une section : titre, sous-onglets, boutons, résumé : src/navigation/entete-section.vue.js -->
        <div data-vue="entete-section"></div>

        <!-- Page Stagiaires (liste et recherche) : src/stagiaires/stagiaires.vue.js -->
        <div data-vue="stagiaires"></div>

        <!-- Page Emploi du temps : src/emploi-du-temps/emploi-du-temps.vue.js -->
        <div data-vue="emploi-du-temps"></div>

        <!-- Page Fiches terrain (contenu rempli par src/fiches/fiches.js) : src/fiches/fiches.vue.js -->
        <div data-vue="fiches"></div>

        <!-- Page Activités (menus de l'emploi du temps) : src/emploi-du-temps/activites.vue.js -->
        <div data-vue="activites"></div>

        <!-- Saisie des notes : onglets Physiques et Pédagogiques : src/notes/notes.vue.js -->
        <div data-vue="notes"></div>

        <!-- Saisie des notes : onglet Comportement : src/comportement/comportement.vue.js -->
        <div data-vue="comportement"></div>

        <!-- Saisie des notes : onglet Relevé individuel : src/releve/releve.vue.js -->
        <div data-vue="releve"></div>

        <!-- Saisie des notes : onglet Moyenne : src/notes/moyennes.vue.js -->
        <div data-vue="moyennes"></div>
      </div>
    </div>
  </main>

  <!-- Listes de suggestions du formulaire stagiaire : src/stagiaires/stagiaires.vue.js -->
  <div data-vue="listes-stagiaires"></div>

  <!-- Fenêtre d'accès au dossier du projet : src/stockage/acces-dossier.vue.js -->
  <div data-vue="fenetre-acces"></div>

  <!-- Fenêtre Sections (ajout, modification, sélection) : src/sections/sections.vue.js -->
  <div data-vue="fenetre-sections"></div>

  <!-- Fenêtre d'un créneau d'emploi du temps : src/emploi-du-temps/emploi-du-temps.vue.js -->
  <div data-vue="fenetre-creneau"></div>

  <!-- Fenêtre « Modifier » les colonnes d'une fiche terrain : src/fiches/fiches.vue.js -->
  <div data-vue="fenetre-colonnes"></div>

  <!-- Fenêtre d'impression des fiches terrain : src/fiches/fiches.vue.js -->
  <div data-vue="fenetre-impression-fiches"></div>

  <!-- Fenêtre « Personnaliser la grille » (péda / comportement) : src/grilles/grilles.vue.js -->
  <div data-vue="fenetre-grille"></div>

  <!-- Fenêtre d'export des notes (impression, PDF, Excel) : src/notes/notes.vue.js -->
  <div data-vue="fenetre-export-notes"></div>

  <!-- Fenêtre d'ajout / modification d'un stagiaire : src/stagiaires/stagiaires.vue.js -->
  <div data-vue="fenetre-stagiaire"></div>

  <!-- Fenêtre de confirmation : src/noyau/interface.vue.js -->
  <div data-vue="fenetre-confirmation"></div>

  <!-- Notifications -->
  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[70] flex w-80 flex-col gap-2"></div>
</div>

<!-- Feuille imprimée (remplie par src/impression/impression.js) -->
<div id="print-sheet"></div>

<!-- Vues : HTML des pages et fenêtres, injecté dans les emplacements data-vue ci-dessus (avant le code de l'application) -->
<script src="src/noyau/vues.js"></script>
<script src="src/accueil/accueil.vue.js"></script>
<script src="src/baremes/baremes.vue.js"></script>
<script src="src/navigation/entete-section.vue.js"></script>
<script src="src/stagiaires/stagiaires.vue.js"></script>
<script src="src/emploi-du-temps/emploi-du-temps.vue.js"></script>
<script src="src/fiches/fiches.vue.js"></script>
<script src="src/emploi-du-temps/activites.vue.js"></script>
<script src="src/notes/notes.vue.js"></script>
<script src="src/comportement/comportement.vue.js"></script>
<script src="src/releve/releve.vue.js"></script>
<script src="src/notes/moyennes.vue.js"></script>
<script src="src/stockage/acces-dossier.vue.js"></script>
<script src="src/sections/sections.vue.js"></script>
<script src="src/grilles/grilles.vue.js"></script>
<script src="src/noyau/interface.vue.js"></script>
<script src="vendor/sql-wasm.js"></script>
<script src="vendor/sql-wasm-binary.js"></script>
<!-- Application : scripts classiques (pas de modules) pour fonctionner en ouvrant directement index.html (file://).
     L'ordre compte : chaque fichier peut utiliser ce qui est déclaré dans les fichiers chargés avant lui. -->
<!-- Noyau : constantes, utilitaires, état, éléments d'interface communs -->
<script src="src/noyau/constantes.js"></script>
<script src="src/stockage/schema.js"></script>
<script src="src/noyau/utilitaires.js"></script>
<script src="src/noyau/etat.js"></script>
<script src="src/noyau/interface.js"></script>
<!-- Stockage : dossier du projet et base SQLite (db/ccpg.db) -->
<script src="src/stockage/memoire-dossier.js"></script>
<script src="src/stockage/acces-dossier.js"></script>
<script src="src/stockage/base-de-donnees.js"></script>
<!-- Navigation et pages générales -->
<script src="src/navigation/navigation.js"></script>
<script src="src/accueil/accueil.js"></script>
<script src="src/sections/sections.js"></script>
<script src="src/stagiaires/stagiaires.js"></script>
<!-- Barèmes et coefficients -->
<script src="src/baremes/baremes-defaut.js"></script>
<script src="src/baremes/versions.js"></script>
<script src="src/baremes/coefficients.js"></script>
<script src="src/baremes/page-baremes.js"></script>
<script src="src/baremes/echange.js"></script>
<!-- Saisie des notes -->
<script src="src/notes/calcul.js"></script>
<script src="src/notes/moyennes.js"></script>
<script src="src/notes/saisie.js"></script>
<script src="src/notes/physiques.js"></script>
<script src="src/notes/exemption.js"></script>
<!-- Impression et exports -->
<script src="src/impression/impression.js"></script>
<script src="src/export/xlsx.js"></script>
<script src="src/notes/export-notes.js"></script>
<!-- Emploi du temps -->
<script src="src/emploi-du-temps/emploi-du-temps.js"></script>
<script src="src/emploi-du-temps/activites.js"></script>
<!-- Fiches terrain, grilles d'évaluation, comportement, relevé individuel -->
<script src="src/fiches/fiches.js"></script>
<script src="src/fiches/colonnes.js"></script>
<script src="src/fiches/impression-fiches.js"></script>
<script src="src/grilles/grilles.js"></script>
<script src="src/grilles/editeur-grille.js"></script>
<script src="src/fiches/peda.js"></script>
<script src="src/comportement/comportement.js"></script>
<script src="src/releve/releve.js"></script>
<!-- Démarrage (en dernier) -->
<script src="src/app/evenements.js"></script>
<script src="src/app/demarrage.js"></script>
</body>
</html>
